name: Daily Tech News

on:
  workflow_dispatch:         # 由 cron-job.org 在 17:00 UTC (13:00 EDT) 觸發

jobs:
  run-news-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15      # 超過 15 分鐘強制中止，避免卡住燒 Actions 分鐘數

    steps:
      # 1. 把 repo 的程式碼下載到 runner 機器上
      - name: Checkout repo
        uses: actions/checkout@v4

      # 2. 裝 Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"       # 快取 pip 套件，加快後續執行速度

      # 3. 安裝 requirements.txt 裡列出的套件
      - name: Install dependencies
        id: install
        shell: bash
        run: pip install -r requirements.txt 2>&1 | tee run.log   # 失敗時 email 會帶 pip 錯誤

      # 4. 執行主程式，把三個 secrets 注入為環境變數
      #    輸出同時寫進 run.log，失敗時給 email 抓原因（shell: bash 才有 pipefail）
      - name: Run news engine
        id: run
        shell: bash
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py 2>&1 | tee run.log

      # 任何步驟失敗 → 寄 email 通知（引擎、時間、失敗原因）
      - name: Email on failure
        if: failure()
        env:
          SMTP_USER:         ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          NOTIFY_EMAIL_TO:   ${{ secrets.NOTIFY_EMAIL_TO }}
          RUN_URL:           ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          STEP_OUTCOMES: >-
            install=${{ steps.install.outcome }}
            run=${{ steps.run.outcome }}
        run: python3 notify_failure.py "Tech News" run.log
